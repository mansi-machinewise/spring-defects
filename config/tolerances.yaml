inspection:
  require_all_modules: false
  max_parallel_workers: 3

calibration:
  px_per_mm: null
  known_size_mm: 10.0

camera:
  mode: simulation
  camera1_index: 0
  camera2_index: 1
  capture_timeout_seconds: 2.0
  frame_selection:
    manufacture_window_start_seconds: 14.0
    manufacture_window_end_seconds: 15.0
    minimum_sharpness: 50.0

yolo_detect:
  enabled: true
  checkpoint_path: runs/detect/spring_detector_v1/weights/best.pt
  confidence_threshold: 0.50
  spring_class_id: 0
  image_size: 640

yolo_pose:
  enabled: false
  front_checkpoint_path: models/yolo_pose.pt
  top_checkpoint_path: models/yolo_pose.pt
  confidence_threshold: 0.50
  image_size: 960
  keypoint_names: [pt1, pt2, pt3, pt4, pt5, pt6, pt7]

patchcore:
  enabled: true
  checkpoint_root: models/patchcore_aligned

  segmentation_enabled: true
  segmentation_checkpoint: runs/segment/runs/segment/spring_seg_v2/weights/best.pt
  segmentation_confidence: 0.10
  segmentation_image_size: 960

  regional_thresholds:
    upper: 0.5
    shaft: 0.5
    lower: 0.5

  anomaly_threshold: 0.5

dimensions:
  top_coil_count: 6
  bottom_coil_count: 6

module3_hook_angle:
  expected_separation_degrees: 180.0
  max_angle_error_degrees: 15.0

total_length:
  nominal: 120.0
  min: null
  max: null

top_coil_height:
  min: null
  max: null

bottom_coil_height:
  min: null
  max: null

shaft_length:
  min: null
  max: null

shaft_straightness:
  max_deviation: null

pitch_per_coil:
  min: null
  max: null

coil_outer_diameter:
  nominal: 10.98
  min: null
  max: null