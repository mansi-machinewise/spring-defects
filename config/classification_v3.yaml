experiment: spring_cls_v3
task: classification

model: yolo11s-cls.pt
data: data/yolo_cls

epochs: 100
imgsz: 224
batch: 32
device: 0
pretrained: true

# Generalization experiment
augmentation:
  fliplr: 0.5
  translate: 0.1
  scale: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  auto_augment: randaugment
  erasing: 0.4

purpose: improve_generalization
change_from_v2: explicitly preserve classification augmentation while testing regularization/generalization